# ALMANAC publisher Worker configuration (skeleton).
#
# Deliberately no [triggers] section: nothing in this repository schedules
# this Worker. Wiring a Cron Trigger, and setting the app ingest URL and the
# shared signing secret, are separate, founder-gated steps, decided after
# this skeleton, its tests, and its own verification script are reviewed on
# their own pull request... and after the app-side `almanac-ingest` function
# exists (ARCHITECTURE.md Section 11). The same discipline the scout
# skeleton shipped under (see scout/wrangler.toml).
#
# Identifiers only; no secrets here (hold 1). Same Cloudflare account as the
# console and the rest of ALMANAC (MAD v2.55).
name = "almanac-publisher"
main = "src/index.js"
compatibility_date = "2026-09-01"
account_id = "bbe6d5f6cc43632eafdd5ef854f48a25"

[vars]
# Nothing sets this to "true" anywhere in this repository. See src/index.js.
PUBLISHER_ENABLED = "false"
# Placeholder; the app repo's URL, filled in when almanac-ingest is deployed.
APP_INGEST_URL = ""

[[d1_databases]]
binding = "DB"
database_name = "almanac"
database_id = "c884b684-1954-4b50-a20f-7d94a62b457a"
migrations_dir = "../migrations"

# Staging: a separate database, same as the console's and the scout's.
[env.staging]
name = "almanac-publisher-staging"

[env.staging.vars]
PUBLISHER_ENABLED = "false"
APP_INGEST_URL = ""

[[env.staging.d1_databases]]
binding = "DB"
database_name = "almanac-staging"
database_id = "64dcd0c7-3c5a-4ca6-ae27-c8edba3a8a70"
migrations_dir = "../migrations"

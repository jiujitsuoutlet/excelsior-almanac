# ALMANAC publisher Worker configuration.
#
# almanac-ingest (jiujitsuoutlet/excelsior-master PR #103) is deployed to
# pvqdyqquugxkypvrbwhs and its shared secret is set on both sides
# (2026-09-16, founder-approved). PUBLISHER_ENABLED="true" plus the
# [triggers] cron below turn this pipe on for real, every 10 minutes,
# matching ARCHITECTURE.md Section 9's stated cadence.
#
# PAUSED 2026-09-21 until the release gate (founder ruling): production still
# serves the Sep 13 app bundle with the v2.51 floating event markers, so any
# row approved now would land on the live Fire Temple as a floating label --
# the exact design the founder rejected. "Rows and the new frontend ship
# together at the gate, or not at all." Both halves are off together (no
# half-on state): the kill switch, and the schedule. Approvals made meanwhile
# queue in ALMANAC and publish on the first cycle after this is re-enabled.
#
# Identifiers only; no secrets here (hold 1). ALMANAC_PUBLISH_SECRET is set
# via `wrangler secret put`, never written to this file. Same Cloudflare
# account as the console and the rest of ALMANAC (MAD v2.55).
name = "almanac-publisher"
main = "src/index.js"
compatibility_date = "2026-09-01"
account_id = "bbe6d5f6cc43632eafdd5ef854f48a25"

[triggers]
crons = []

[vars]
PUBLISHER_ENABLED = "false"
APP_INGEST_URL = "https://pvqdyqquugxkypvrbwhs.supabase.co/functions/v1/almanac-ingest"

[[d1_databases]]
binding = "DB"
database_name = "almanac"
database_id = "c884b684-1954-4b50-a20f-7d94a62b457a"
migrations_dir = "../migrations"

# Staging: a separate database, same as the console's and the scout's. It is
# its OWN crawl target, not a mirror of production ALMANAC -- confirmed
# 2026-09-24 the hard way: enabling this cron published a single stray
# "Fake event" row that lived only in almanac-staging, while the founder's
# real 43 approved rows live only in PRODUCTION's `almanac` D1. A cron here
# can never carry those rows to the staging app; the one-off script
# (excelsior-almanac/scripts/publish-approved-to-app.mjs) does that instead,
# reading production D1 directly and never touching its published_at.
# BACK OFF: no legitimate standing use for this pipe until staging ALMANAC
# independently holds real approved rows. almanac-ingest itself stays
# deployed to ecronfxsaoilagcwvfyw (proven, harmless, reusable).
[env.staging]
name = "almanac-publisher-staging"

[env.staging.triggers]
crons = []

[env.staging.vars]
PUBLISHER_ENABLED = "false"
APP_INGEST_URL = "https://ecronfxsaoilagcwvfyw.supabase.co/functions/v1/almanac-ingest"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "almanac-staging"
database_id = "64dcd0c7-3c5a-4ca6-ae27-c8edba3a8a70"
migrations_dir = "../migrations"

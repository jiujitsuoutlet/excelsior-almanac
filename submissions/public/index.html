<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Submit a tournament — ALMANAC</title>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #1a1a1a; }
  h1 { font-size: 22px; }
  label { display: block; margin-top: 16px; font-weight: 600; }
  input, select { width: 100%; padding: 8px; margin-top: 4px; font-size: 16px; box-sizing: border-box; }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }
  .checks { display: flex; gap: 16px; margin-top: 8px; font-weight: normal; }
  .checks label { display: flex; align-items: center; gap: 6px; font-weight: normal; margin-top: 0; }
  .checks input { width: auto; }
  button { margin-top: 20px; padding: 12px 20px; font-size: 16px; cursor: pointer; }
  .error { color: #b00020; font-size: 14px; margin-top: 4px; }
  #status { margin-top: 16px; font-weight: 600; }
  /* Real visitors never see this -- a bot filling every input on the page
     fills it too, and that is exactly the signal that flags it as spam.
     Deliberately not display:none/visibility:hidden (some scrapers skip
     those specifically); off-screen positioning instead. */
  .hp { position: absolute; left: -9999px; top: -9999px; }
</style>
</head>
<body>
  <h1>Submit a tournament</h1>
  <p>Running or organizing a jiu-jitsu tournament? Tell us about it and it goes into our review queue.</p>
  <form id="f">
    <label class="hp">Website<input class="hp" name="organizer_website_url" tabindex="-1" autocomplete="off" /></label>

    <label>Event type
      <select name="event_type" required>
        <option value="tournament">Tournament</option>
        <option value="superfight">Superfight</option>
        <option value="seminar">Seminar</option>
        <option value="camp">Camp</option>
        <option value="open_competition">Open competition</option>
      </select>
    </label>
    <label>Event name<input name="name" maxlength="200" required /></label>
    <label>Organizer name<input name="organizer_name" maxlength="200" /></label>
    <div class="row">
      <div><label>Start date<input name="start_date" type="date" required /></label></div>
      <div><label>End date (if multi-day)<input name="end_date" type="date" /></label></div>
    </div>
    <div class="row">
      <div><label>City<input name="city" maxlength="120" required /></label></div>
      <div><label>State (2-letter)<input name="state" maxlength="3" required /></label></div>
    </div>
    <label>Registration link (https://)<input name="registration_url" type="url" required placeholder="https://" /></label>
    <label class="checks"><span></span>
      <label><input type="checkbox" name="gi" /> Gi</label>
      <label><input type="checkbox" name="nogi" /> No-gi</label>
      <label><input type="checkbox" name="kids" /> Kids</label>
    </label>
    <label>Your email (so we can follow up)<input name="submitter_email" type="email" required /></label>

    <div class="cf-turnstile" data-sitekey="__TURNSTILE_SITE_KEY__" data-callback="onTurnstile"></div>
    <button type="submit">Submit for review</button>
    <div id="status"></div>
  </form>
  <script>
    let turnstileToken = null;
    window.onTurnstile = (token) => { turnstileToken = token; };

    document.getElementById('f').addEventListener('submit', async (e) => {
      e.preventDefault();
      const statusEl = document.getElementById('status');
      const form = e.target;
      const data = Object.fromEntries(new FormData(form).entries());
      data.gi = form.gi.checked;
      data.nogi = form.nogi.checked;
      data.kids = form.kids.checked;
      data.turnstileToken = turnstileToken;

      statusEl.textContent = 'Submitting...';
      statusEl.className = '';
      try {
        const res = await fetch('/submit', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
        const out = await res.json();
        if (res.ok) {
          statusEl.textContent = 'Thank you — this is now in our review queue.';
          form.reset();
        } else {
          statusEl.textContent = out.error || 'Something needs fixing.';
          statusEl.className = 'error';
        }
      } catch {
        statusEl.textContent = 'Could not reach the server. Please try again.';
        statusEl.className = 'error';
      }
    });
  </script>
</body>
</html>
